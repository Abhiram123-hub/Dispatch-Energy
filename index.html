<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispatch Energy Assessment</title>
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #172033;
        }
        header {
            background: #172033;
            color: white;
            padding: 18px 28px;
        }
        header h1 { margin: 0; font-size: 24px; }
        header p { margin: 5px 0 0; color: #cbd5e1; }
        .container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px;
        }
        #map {
            height: 500px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 10px rgba(0,0,0,.12);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }
        .card h3 { margin-top: 0; }
        .address { color: #64748b; min-height: 45px; }
        button {
            border: 0;
            border-radius: 7px;
            padding: 10px 14px;
            cursor: pointer;
            background: #2563eb;
            color: white;
            font-weight: bold;
        }
        button:hover { background: #1d4ed8; }
        .status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 8px;
        }
        .resolved { background: #dcfce7; color: #166534; }
        .unresolved, .error { background: #fee2e2; color: #991b1b; }
        #detail {
            display: none;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0,0,0,.1);
            margin-bottom: 20px;
        }
        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }
        .metric {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
        }
        .metric strong { display:block; font-size: 20px; margin-top:5px; }
        .loading { color: #64748b; }
        .error-box {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
<header>
    <h1>Dispatch Energy Assessment</h1>
    <p>Site mapping, solar resource analysis, and PVWatts estimates</p>
</header>

<div class="container">
    <div id="detail"></div>

    <div id="map"></div>

    <h2>Sites</h2>
    <div id="sites" class="grid">
        <div class="loading">Loading sites...</div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let map;
let markers = [];

async function loadSites() {
    const response = await fetch('/api/sites');
    if (!response.ok) throw new Error('Unable to load sites');
    return await response.json();
}

function initMap() {
    map = L.map('map').setView([39.8283, -98.5795], 4);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
}

function statusBadge(status) {
    return `<span class="status ${status}">${status.toUpperCase()}</span>`;
}

function showDetail(site) {
    const detail = document.getElementById('detail');
    detail.style.display = 'block';

    detail.innerHTML = `
        <button onclick="closeDetail()">? Back to Sites</button>
        <h2>${site.name}</h2>
        ${statusBadge(site.geocode_status)}
        <p><strong>Address:</strong> ${site.address}</p>
        ${
            site.latitude !== null
            ? `<p><strong>Coordinates:</strong>
                ${site.latitude.toFixed(6)}, ${site.longitude.toFixed(6)}</p>
               <div id="solar" class="loading">Loading solar resource and PVWatts data...</div>`
            : `<div class="error-box">
                <strong>Location could not be resolved.</strong><br>
                ${site.geocode_error || 'No matching location was found.'}<br><br>
                Solar and PVWatts calculations were skipped because
                coordinates are unavailable.
               </div>`
        }
    `;

    detail.scrollIntoView({behavior: 'smooth'});

    if (site.latitude !== null) {
        loadSolar(site);
    }
}

async function loadSolar(site) {
    const box = document.getElementById('solar');

    try {
        const response = await fetch(
            `/api/solar?latitude=${site.latitude}&longitude=${site.longitude}`
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || 'Solar API failed');
        }

        const resource = data.solar_resource || {};
        const pv = data.pvwatts || {};

        box.className = '';

        box.innerHTML = `
            <h3>Solar Resource</h3>
            <div class="metric-grid">
                <div class="metric">
                    Average GHI
                    <strong>${resource.avg_ghi ?? 'N/A'}</strong>
                </div>
                <div class="metric">
                    Average DNI
                    <strong>${resource.avg_dni ?? 'N/A'}</strong>
                </div>
                <div class="metric">
                    Tilted Irradiance
                    <strong>${resource.avg_lat_tilt ?? 'N/A'}</strong>
                </div>
            </div>

            <h3>PVWatts Estimate</h3>
            ${
                pv.status === 'success'
                ? `<div class="metric-grid">
                    <div class="metric">
                        System Capacity
                        <strong>10 kW</strong>
                    </div>
                    <div class="metric">
                        Annual Energy
                        <strong>${pv.annual_energy_kwh ?? 'N/A'} kWh</strong>
                    </div>
                    <div class="metric">
                        Capacity Factor
                        <strong>${pv.capacity_factor ?? 'N/A'}%</strong>
                    </div>
                   </div>`
                : `<div class="error-box">
                    PVWatts failed: ${pv.error || 'Unknown error'}
                   </div>`
            }
        `;
    } catch (error) {
        box.innerHTML = `
            <div class="error-box">
                Solar/PVWatts request failed: ${error.message}
            </div>
        `;
    }
}

function closeDetail() {
    document.getElementById('detail').style.display = 'none';
    window.scrollTo({top: 0, behavior: 'smooth'});
}

function renderSites(sites) {
    const container = document.getElementById('sites');
    container.innerHTML = '';

    sites.forEach(site => {
        if (site.latitude !== null && site.longitude !== null) {
            const marker = L.marker([site.latitude, site.longitude])
                .addTo(map)
                .bindPopup(`<strong>${site.name}</strong><br>${site.address}`);

            marker.on('click', () => showDetail(site));
            markers.push(marker);
        }

        const card = document.createElement('div');
        card.className = 'card';

        card.innerHTML = `
            <h3>${site.name}</h3>
            ${statusBadge(site.geocode_status)}
            <p class="address">${site.address}</p>
            ${
                site.latitude !== null
                ? `<p>?? ${site.latitude.toFixed(4)}, ${site.longitude.toFixed(4)}</p>`
                : `<div class="error-box">${site.geocode_error || 'Unable to resolve location'}</div>`
            }
            <button>View Details</button>
        `;

        card.querySelector('button').onclick = () => showDetail(site);
        container.appendChild(card);
    });
}

async function main() {
    initMap();

    try {
        const sites = await loadSites();
        renderSites(sites);
    } catch (error) {
        document.getElementById('sites').innerHTML =
            `<div class="error-box">Failed to load sites: ${error.message}</div>`;
    }
}

main();
</script>
</body>
</html>
